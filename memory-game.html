<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A mini game!</title>

    <link rel="icon" type="image/x-icon" href="./Photos/Ico.ico">

    <!-- font links -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <!-- bootstrap -->
    
    <link rel="stylesheet" href="./bootstrap-5.3.2-dist/css/bootstrap.min.css">
    <script src="./bootstrap-5.3.2-dist/js/bootstrap.min.js"></script>

    <!-- links_for_cssandjava -->
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>

</head>
<body>
<main>

    <!-- INTRO SCREEN -->
    <section id="intro-screen" class="text-center">

        <div class="intro-game">

            <h1 id="typing-text" class="mb-4"></h1>
            <p class="mb-4">
            Before you see her answer, let's see how well you know your Luna <3
            </p>

            <button id="start-button" class="btn btn-dark rounded-pill px-3 quiz-btn">
                Start the quiz ->
            </button>
        </div>

    </section>


    <!-- QUIZ SCREEN -->
    <section id="quiz-screen" class="quiz-card mx-auto p-4" hidden>

        <div class="d-flex justify-content-between mb-3">
            <span id="question-counter">Question 1 of 10</span>
            <span id="score-display">Score: 0</span>
        </div>

        <div class="progress mb-4" role="progressbar"
             aria-label="Quiz progress"
             aria-valuemin="0"
             aria-valuemax="10"
             aria-valuenow="0">
            <div id="progress-bar"
                 class="progress-bar"
                 style="width: 0%">
            </div>
        </div>

        <h2 id="question-text" class="mb-4"></h2>

        <!-- Answer choices appear here -->
        <div id="answer-options" class="answer-options"></div>

        <!-- Written answers appear here for questions 9 and 10 -->
        <div id="written-answer-area" hidden>
            <label for="written-answer" class="form-label">
                Your answer
            </label>

            <textarea
                id="written-answer"
                class="form-control"
                rows="4"
                placeholder="Type your answer here..."
            ></textarea>
        </div>

        <p id="feedback" class="mt-3" aria-live="polite"></p>

        <button id="next-button" class="btn btn-dark w-100 mt-3  check-ans-btn">Check answer ></button>

    </section>


    <!-- RESULTS SCREEN -->
    <section id="results-screen" class="text-center" hidden>

        <p class="quiz-completed" id="result-heading">Quiz completed!!!</p>

        <p id="final-score" class="fs-3 mt-4"></p>

        <p id="result-message" class="mb-4"></p>

        <a href="./answer.html" id="start-button" class="btn btn-dark rounded-pill px-3 quiz-btn">
            Do you want the answer noww?? ->
        </a>


    </section>

    

</main>


    
    <div>
        <img src="./Photos/background-2.jpeg" class="game-paper w-100" alt="" srcset="">
    </div>

</body>
</html>
